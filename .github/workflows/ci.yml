name: Validate ADE domain and prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm --prefix ade/prototype run check
      - run: npm --prefix ade/prototype test
      - run: node --test ade/test/*.test.mjs
