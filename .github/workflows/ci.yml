name: Validate ADE domain and prototype
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ade-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run ade:setup:test
      - run: npm --prefix ade/prototype run check
      - run: npm --prefix ade/prototype test
      - run: node --test ade/test/*.test.mjs
  code-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ade/code-import/package-lock.json
      - run: npm --prefix ade/code-import ci --ignore-scripts
      - run: npm --prefix ade/ai ci --ignore-scripts
      - run: npm --prefix ade/code-import run check
      - run: npm --prefix ade/code-import test
      - run: npm --prefix ade/ai run check
      - run: npm --prefix ade/ai test
